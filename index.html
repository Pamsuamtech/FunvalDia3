<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo Intento, Tarea del Día Tres</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

 <main class="maincontainer">
    <header>
        <h1>New Visits Registration</h1>
    <p>Documenting pastoral care and fellowship visits across the Stake</p>
    </header>

    <form class="grid-layout">

        <div class="columna">
    <section class="card">
        <div class="card-header">
            <span>👤</span>
            <h>MEMBER INFORMATION</h>
            </div>
            <div class="arriba">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter member namde">
        </div>
        <div class="arriba">
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" placeholder="Street, City, Postal Code">
        </div>
        <div class="arriba">
            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone" placeholder=" +1 (555) 000-0000">
        </div>
        </section>

    <section class="card">
        <div class="card-header">
            <span>📄</span>
            <h>VISIT DETAILS</h>
        </div>
        <div class="arriba">
            <label for="comments">Comments and Observations:</label>
            <textarea id="comments" name="comments" placeholder="Enter any comments or observations about the visit..."></textarea>
        </div>
    </section>
</div>

<div class="columna">
    <section class="card">
        <div class="card-header">
            <span>🕒 </span>
            <h2>LOGISTICS</h2>
            </div>
            <div class="input-group-row">
                <div class="input-group">
                    <label for="date">Date:</label>
                    <input type="date" id="date" name="date">
                </div>
             </div>

             <div class="arriba">
                <label for="Registrar">Registrar:</label>
                <input type="text" id="Registrar" name="Registrar" placeholder="Full Name of Registrar">
             </div>
    </section>

    <section class="map-card">
        <div class="map-placeholder">
            <button type="button" class="location-btn" onclick="alert('Map functionality coming soon!')">LOCATION PREVIEW</button>
        </div>
    </section>

    <button type="submit" class="submit-btn">💾 GUARDAR REGISTRO</button>
    <small class="disclaimer">*Information Recorded For Internal Congregational Support Only</small>
</div>
            

</form>
 </main>
    
</body>
</html>
