<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeworkDay3</title>
    <link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="maincontainer">
    <header>
        <h1>New Visits Registration</h1>
    <p>Documenting pastoral care and fellowship visits across the Stake</p>
    </header>

    <div class="grid-layout">

        <divdivclass="columna">
            
    </div>
</div>

    </main>

    <section class="card">
        <div class="card-header">
            <span> 👤 </span>
            <h2>MEMBER INFORMATION</h2>
            </div>
        <div class="arriba">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
    </div>
        <div class="arriba">
            <label for="address">Address:</label>
            <input type="text" id="address" name="address">
    </div>
        <div class="arriba">
            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone">
        </div>
    </section>

    <selection class="card">
        <div class="card-header">
            <span>🕒 </span>
            <h2>LOGISTICS</h2>
            <div class="lado">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date">
            </div>
            <div class="arriba">
                <label for="time">Time:</label>
                <input type="time" id="time" name="time">
            </div>
            <div class="arriba">
                <label for="status">Status:</label>
                <select id="status" name="status">
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="arriba">
                <label for="registrar">Registrar:</label>
                <input type="text" id="registrar" name="registrar">
            </div>
        </div>
    </selection>

    <selection class="card"
     < div class="card-header">
        <span>📝</span>
        <h2>VISIT DETAILS</h2>
    </div>
    <div class="arriba">
        <label for="comments">Comments & Observations:</label>
        <textarea 
        id="comments" 
        name="comments" 
        rows="5"></textarea>
    </div>
    </selection>



       


           

</body>
</html>
